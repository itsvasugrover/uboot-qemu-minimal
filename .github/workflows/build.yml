name: Build

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make flex bison bc \
            python3 python3-dev python3-pip python3-setuptools swig \
            openssl libssl-dev libgnutls28-dev u-boot-tools \
            device-tree-compiler python3-pyelftools

      - name: Clone U-Boot
        run: bash setup.sh

      - name: Build U-Boot
        run: bash build.sh

      - name: Show build log on failure
        if: failure()
        run: cat logs/build.log || true

      - name: Upload ROM artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-rom-${{ github.sha }}
          path: build/u-boot.rom
          retention-days: 30
