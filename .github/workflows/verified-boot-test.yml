name: Verified Boot Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  verified-boot:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make flex bison bc \
            python3 python3-dev python3-pip python3-setuptools swig \
            openssl libssl-dev libgnutls28-dev u-boot-tools \
            device-tree-compiler python3-pyelftools \
            qemu-system-x86 swtpm swtpm-tools

      - name: Clone and build U-Boot
        run: bash setup.sh && bash build.sh

      - name: Generate RSA-4096 signing key
        run: bash scripts/gen-keys.sh dev

      - name: Assemble demo FIT image
        run: bash scripts/make-demo-fit.sh dev

      - name: Sign FIT and embed certificate into ROM
        run: bash scripts/embed-key.sh dev

      # ── Positive test: signed FIT must be accepted ──────────────────────────

      - name: Boot with signed FIT image (30 s timeout)
        run: |
          mkdir -p logs
          set +e
          timeout 30 bash qemu.sh --no-kvm \
            --serial-log logs/vboot-serial.log \
            --boot-img build/boot.img
          EXIT=$?
          set -e
          # 0 = QEMU exited cleanly, 124 = timed out (normal — demo payload has no OS)
          if [ "$EXIT" -ne 0 ] && [ "$EXIT" -ne 124 ]; then
            echo "QEMU exited with unexpected code: $EXIT"
            cat logs/vboot-serial.log || true
            exit 1
          fi

      - name: Verify signature check passed
        run: |
          if ! grep -q "sha256,rsa4096:dev+ OK" logs/vboot-serial.log; then
            echo "ERROR: Signature verification success string not found in serial log."
            echo "Expected:  sha256,rsa4096:dev+ OK"
            echo "--- Serial log ---"
            cat logs/vboot-serial.log
            exit 1
          fi
          echo "PASS: Signed FIT accepted — verified boot working."
          grep "sha256,rsa4096" logs/vboot-serial.log

      # ── Negative test: unsigned FIT must be rejected ─────────────────────────
      # ROM still has the 'dev' certificate baked in from the step above.
      # Re-running make-demo-fit.sh produces a fresh unsigned boot.img — U-Boot
      # must reject it because no valid RSA-4096 signature is present.

      - name: Create unsigned FIT image (negative test payload)
        run: bash scripts/make-demo-fit.sh dev

      - name: Attempt to boot unsigned FIT image (30 s timeout)
        run: |
          set +e
          timeout 30 bash qemu.sh --no-kvm \
            --serial-log logs/neg-serial.log \
            --boot-img build/boot.img
          EXIT=$?
          set -e
          if [ "$EXIT" -ne 0 ] && [ "$EXIT" -ne 124 ]; then
            echo "QEMU exited with unexpected code: $EXIT"
            cat logs/neg-serial.log || true
            exit 1
          fi

      - name: Verify unsigned FIT was rejected
        run: |
          if grep -q "sha256,rsa4096:dev+ OK" logs/neg-serial.log; then
            echo "ERROR: Unsigned FIT was accepted — security regression!"
            echo "--- Serial log ---"
            cat logs/neg-serial.log
            exit 1
          fi
          echo "PASS: Unsigned FIT correctly rejected — fails-closed behaviour confirmed."
          echo "--- Relevant serial log lines ---"
          grep -i "verif\|signature\|hash\|bootm\|error\|bad" logs/neg-serial.log || true

      # ── Logs ─────────────────────────────────────────────────────────────────

      - name: Upload logs
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: verified-boot-logs-${{ github.sha }}
          path: logs/
          retention-days: 7
